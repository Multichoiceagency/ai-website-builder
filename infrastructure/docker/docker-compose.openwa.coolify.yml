# OpenWA for Coolify — single-container WhatsApp gateway
#
# Deploy as a Coolify Docker Compose service from this file, or from the
# OpenWA repo (https://github.com/rmyndharis/OpenWA) with the same env.
#
# Required Coolify env:
#   OPENWA_API_KEY          — shared secret (also set on core-api)
# Optional:
#   OPENWA_PORT=2785
#
# After deploy, attach a public HTTPS domain and set on core-api:
#   OPENWA_BASE_URL=https://openwa.your-domain
#   OPENWA_API_KEY=<same key>
#
# Tenants paste that HTTPS URL + API key in Dashboard → CRM → Support → Connect OpenWA.

services:
  openwa:
    build:
      context: https://github.com/rmyndharis/OpenWA.git#main
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - '${OPENWA_PORT:-2785}:2785'
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      NODE_ENV: production
      PORT: 2785
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      LOG_LEVEL: info
      AUTO_START_SESSIONS: 'true'
      DATABASE_TYPE: sqlite
      DATABASE_SYNCHRONIZE: 'true'
      SESSION_DATA_PATH: /app/data/sessions
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      PLUGINS_DIR: /app/data/plugins
      PUPPETEER_HEADLESS: 'true'
      PUPPETEER_ARGS: '--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu'
      API_KEY: ${OPENWA_API_KEY:?set OPENWA_API_KEY}
    volumes:
      - openwa-data:/app/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:2785/api/health/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" || node -e "fetch(\"http://127.0.0.1:2785/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

volumes:
  openwa-data:
