# Coolify / production stack for the AI website builder monorepo.
# Deploy as a Coolify Docker Compose service from the repository root.
# Set secrets in Coolify env — never commit real values.
name: platform

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
    volumes:
      - minio-data:/data

  core-api:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.core-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB_USER: ${APP_DB_USER:-app_user}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-eu-central-1}
      S3_BUCKET: ${S3_BUCKET:-platform-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      CORE_API_HOST: 0.0.0.0
      CORE_API_PORT: 4000
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CORE_API_URL: ${CORE_API_URL}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
      STOREFRONT_URL: ${STOREFRONT_URL:-}
      PLATFORM_EDGE_HOSTNAME: ${PLATFORM_EDGE_HOSTNAME:-}
      STOREFRONT_PUBLIC_HOST: ${STOREFRONT_PUBLIC_HOST:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NANGO_SECRET_KEY: ${NANGO_SECRET_KEY:-}
      NANGO_HOST: ${NANGO_HOST:-http://nango-server:3003}
      NANGO_WEBHOOK_SECRET: ${NANGO_WEBHOOK_SECRET:-}
      NANGO_GOOGLE_INTEGRATION_ID: ${NANGO_GOOGLE_INTEGRATION_ID:-google}
      OPENWA_BASE_URL: ${OPENWA_BASE_URL:-http://openwa:2785}
      OPENWA_API_KEY: ${OPENWA_API_KEY:-}
      OPENWA_WEBHOOK_SECRET: ${OPENWA_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_AUTH_REDIRECT_URI: ${GOOGLE_AUTH_REDIRECT_URI:-}
    ports:
      - "${CORE_API_PORT:-4000}:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  dashboard:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.dashboard
    restart: unless-stopped
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_CORE_API_URL: ${CORE_API_URL}
      NUXT_PUBLIC_STOREFRONT_URL: ${STOREFRONT_URL}
      CORE_API_URL: ${CORE_API_URL}
      STOREFRONT_URL: ${STOREFRONT_URL}
      DASHBOARD_URL: ${DASHBOARD_URL:-}
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"

  storefront:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.storefront
    restart: unless-stopped
    depends_on:
      core-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
      NUXT_PUBLIC_CORE_API_URL: ${CORE_API_URL}
      CORE_API_URL: ${CORE_API_URL}
    ports:
      - "${STOREFRONT_PORT:-3001}:3001"

  nango-db:
    image: postgres:16.0-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nango
      POSTGRES_PASSWORD: ${NANGO_DB_PASSWORD:?set NANGO_DB_PASSWORD}
      POSTGRES_DB: nango
    volumes:
      - nango-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nango -d nango']
      interval: 5s
      timeout: 5s
      retries: 10

  nango-server:
    image: nangohq/nango-server:hosted
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      nango-db:
        condition: service_healthy
    ports:
      - '${NANGO_SERVER_PORT:-3003}:3003'
      - '${NANGO_CONNECT_UI_PORT:-3009}:3009'
    environment:
      NANGO_DB_USER: nango
      NANGO_DB_PASSWORD: ${NANGO_DB_PASSWORD}
      NANGO_DB_HOST: nango-db
      NANGO_DB_NAME: nango
      NANGO_DB_SSL: 'false'
      RECORDS_DATABASE_URL: postgresql://nango:${NANGO_DB_PASSWORD}@nango-db:5432/nango
      SERVER_PORT: 3003
      NANGO_SERVER_URL: ${NANGO_SERVER_URL:?set NANGO_SERVER_URL}
      NANGO_PUBLIC_SERVER_URL: ${NANGO_PUBLIC_SERVER_URL:?set NANGO_PUBLIC_SERVER_URL}
      NANGO_PUBLIC_CONNECT_URL: ${NANGO_PUBLIC_CONNECT_URL:?set NANGO_PUBLIC_CONNECT_URL}
      FLAG_AUTH_ENABLED: ${NANGO_FLAG_AUTH_ENABLED:-false}
      FLAG_SERVE_CONNECT_UI: 'true'
      NANGO_DASHBOARD_USERNAME: ${NANGO_DASHBOARD_USERNAME:-}
      NANGO_DASHBOARD_PASSWORD: ${NANGO_DASHBOARD_PASSWORD:-}
      NANGO_ENCRYPTION_KEY: ${NANGO_ENCRYPTION_KEY:?set NANGO_ENCRYPTION_KEY}
      NANGO_LOGS_ENABLED: 'false'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CSP_REPORT_ONLY: 'true'

  openwa:
    build:
      context: https://github.com/rmyndharis/OpenWA.git#main
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 45s
    # Coolify / public hosts must bind 0.0.0.0 (not 127.0.0.1).
    ports:
      - '${OPENWA_PORT:-2785}:2785'
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      NODE_ENV: production
      PORT: 2785
      HOME: /tmp
      XDG_CONFIG_HOME: /tmp/.config
      XDG_CACHE_HOME: /tmp/.cache
      LOG_LEVEL: info
      AUTO_START_SESSIONS: 'true'
      DATABASE_TYPE: sqlite
      DATABASE_SYNCHRONIZE: 'true'
      SESSION_DATA_PATH: /app/data/sessions
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      PLUGINS_DIR: /app/data/plugins
      PUPPETEER_HEADLESS: 'true'
      PUPPETEER_ARGS: '--no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu'
      API_KEY: ${OPENWA_API_KEY:?set OPENWA_API_KEY}
      # Set after Coolify assigns the public domain, e.g. https://openwa.example.com
      # OPENWA public URL is also configured on core-api as OPENWA_BASE_URL.
    volumes:
      - openwa-data:/app/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:2785/api/health/ready\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" || node -e "fetch(\"http://127.0.0.1:2785/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

volumes:
  postgres-data:
  redis-data:
  minio-data:
  nango-db-data:
  openwa-data:
