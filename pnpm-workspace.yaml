packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
  - "workers/*"
allowBuilds:
  # vitest's bundler — needs its postinstall to fetch the platform binary.
  esbuild: true
  # Transitive of the shadcn-vue CLI (shadcn-vue -> reka-ui -> @floating-ui/vue).
  # Its postinstall only rewrites vue-demi to match the installed Vue major. We
  # never import or execute vue-demi — it arrives under a root devDependency and
  # reaches no shipped code — so the script stays off. See docs/UI-LIBRARIES.md.
  vue-demi: false
